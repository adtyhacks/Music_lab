<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Feedback - MusicLab</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='feedback.css') }}">
    <style>
        /* Floating elements (notes, instruments) styles */
        .instrument, .note {
            position: absolute;
            width: 50px;
            height: 50px;
            animation: floatAround 10s ease-in-out infinite;
        }

        @keyframes floatAround {
            0% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(150px, -200px);
            }
            50% {
                transform: translate(-100px, 100px);
            }
            75% {
                transform: translate(200px, 150px);
            }
            100% {
                transform: translate(0, 0);
            }
        }

        .note {
            animation: floatNotes 10s ease-in-out infinite;
        }

        @keyframes floatNotes {
            0% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(150px, -200px);
            }
            50% {
                transform: translate(-100px, 100px);
            }
            75% {
                transform: translate(200px, 150px);
            }
            100% {
                transform: translate(0, 0);
            }
        }

        /* Bouncing form animation */
        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-10px);
            }
            50% {
                transform: translateY(0);
            }
            75% {
                transform: translateY(-5px);
            }
            100% {
                transform: translateY(0);
            }
        }

        .about-section {
            animation: bounce 1s ease-in-out;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 1rem;
            color: #fff;
            background-color: #4a2b0a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #be1d1d;
        }

        button:active {
            background-color: #d54f4f;
        }

        /* ========== CUSTOM CURSOR ========== */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: rgba(190, 29, 29, 0.7);
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .cursor-follower {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 2px solid rgba(190, 29, 29, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease, width 0.2s ease, height 0.2s ease;
        }

        .cursor.active, 
        .cursor-follower.active {
            transform: translate(-50%, -50%) scale(1.5);
            background-color: rgba(236, 192, 203, 0.5);
        }

        .cursor.click {
            transform: translate(-50%, -50%) scale(0.8);
            background-color: rgba(74, 43, 10, 0.8);
        }

        /* Hide cursor on mobile */
        @media (max-width: 768px) {
            .cursor, .cursor-follower {
                display: none;
            }
            
            * {
                cursor: default !important;
            }
        }
    </style>
</head>
<body>
    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Go Back Button -->
    <button class="go-back-btn" onclick="window.history.back()">Go Back</button>

    <header>
        <!-- You can add a navigation bar or logo here -->
    </header>

    <main>
        <div class="container">
            <div class="about-section">
                <h1>Feedback</h1>
                <p>We would love to hear your thoughts!</p>
                <form id="feedbackForm" action="{{ url_for('submit_feedback') }}" method="POST">
                    <textarea name="feedback" placeholder="Write your feedback here..." required></textarea>
                    <br>
                    <button type="submit">Send Feedback</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Custom Cursor
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            
            setTimeout(() => {
                cursorFollower.style.left = e.clientX + 'px';
                cursorFollower.style.top = e.clientY + 'px';
            }, 100);
        });

        // Interactive elements effect
        const interactiveElements = document.querySelectorAll('a, button, textarea, input');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.classList.add('active');
                cursorFollower.classList.add('active');
            });
            el.addEventListener('mouseleave', () => {
                cursor.classList.remove('active');
                cursorFollower.classList.remove('active');
            });
            el.addEventListener('mousedown', () => {
                cursor.classList.add('click');
            });
            el.addEventListener('mouseup', () => {
                cursor.classList.remove('click');
            });
        });
    </script>
</body>
</html>
